[package]
name = "neon-expanse"
version = "0.0.1-dev"
edition = "2024"
rust-version = "1.85"
authors = ["Neon Expanse Contributors"]
description = "Earth-scale voxel exploration game — Bevy + Avian3d"

[dependencies]
bevy = { version = "0.18", features = ["dynamic_linking", "serialize"] }
avian3d = "0.6.0-rc.1"
serde = { version = "1", features = ["derive"] }
ron = "0.8"
glam = "0.29"

[dev-dependencies]
proptest = "1"

[features]
default = []
# Enable Tracy profiler integration (run with: cargo run --features tracy)
tracy = ["bevy/trace_tracy"]

# Fast dev builds: dynamic linking + minimal optimisation
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
